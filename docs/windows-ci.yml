name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1 -Test
      - name: Render style previews
        shell: powershell
        continue-on-error: true
        run: ./scripts/preview.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KoraDesk-style-previews
          path: dist/previews/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: KoraDesk-windows-x64
          path: |
            dist/Kora.exe
            dist/Kora.exe.config
            dist/Kora.Widget.exe
            dist/Kora.Widget.exe.config
            dist/Kora.Core.dll
            dist/Kora.ico
            dist/fonts/*
