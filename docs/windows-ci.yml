name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: KoraDesk-windows-x64
          path: |
            dist/Kora.exe
            dist/Kora.exe.config
            dist/Kora.Widget.exe
            dist/Kora.Widget.exe.config
            dist/Kora.Core.dll
            dist/Kora.ico
